apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: l4s-lidar-receiver-role
  namespace: l4s-lidar
  labels:
    app.kubernetes.io/name: l4s-lidar-receiver
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: l4s-lidar-receiver-rolebinding
  namespace: l4s-lidar
  labels:
    app.kubernetes.io/name: l4s-lidar-receiver
subjects:
  - kind: ServiceAccount
    name: l4s-lidar-receiver
roleRef:
  kind: Role
  name: l4s-lidar-receiver-role
  apiGroup: rbac.authorization.k8s.io
