apiVersion: apps/v1
kind: Deployment
metadata:
  name: l4s-lidar-sender
  namespace: l4s-lidar
  labels:
    app.kubernetes.io/name: l4s-lidar-sender
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: l4s-lidar-sender
  template:
    metadata:
      labels:
        app.kubernetes.io/name: l4s-lidar-sender
    spec:
      serviceAccountName: l4s-lidar-sender
      containers:
        - name: l4s-lidar-sender
          image: ghcr.io/achilleas2942/l4s-ros:pointcloud
          imagePullPolicy: Always
          command: ["bash"]
          args: ["/opt/pointcloud/sender_scripts/sender.sh"]
          tty: true
          stdin: true
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: l4s-lidar-sender-config
                  key: LOG_LEVEL
            # Secret envs (values created by run_k8s.sh)
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: l4s-lidar-common-secret
                  key: API_TOKEN
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: l4s-lidar-common-secret
                  key: PASSWORD
          ports:
            # UDP ports 30000-30009
            - containerPort: 30000
              protocol: UDP
            - containerPort: 30001
              protocol: UDP
            - containerPort: 30002
              protocol: UDP
            - containerPort: 30003
              protocol: UDP
            - containerPort: 30004
              protocol: UDP
            - containerPort: 30005
              protocol: UDP
            - containerPort: 30006
              protocol: UDP
            - containerPort: 30007
              protocol: UDP
            - containerPort: 30008
              protocol: UDP
            - containerPort: 30009
              protocol: UDP
            # UDP ports 50000-50007 and 51000
            - containerPort: 50000
              protocol: UDP
            - containerPort: 50001
              protocol: UDP
            - containerPort: 50002
              protocol: UDP
            - containerPort: 50003
              protocol: UDP
            - containerPort: 50004
              protocol: UDP
            - containerPort: 50005
              protocol: UDP
            - containerPort: 50006
              protocol: UDP
            - containerPort: 50007
              protocol: UDP
            - containerPort: 51000
              protocol: UDP
            # TCP odd ports 30001-30009
            - containerPort: 30001
              protocol: TCP
            - containerPort: 30003
              protocol: TCP
            - containerPort: 30005
              protocol: TCP
            - containerPort: 30007
              protocol: TCP
            - containerPort: 30009
              protocol: TCP
            # TCP odd ports 50001-50007
            - containerPort: 50001
              protocol: TCP
            - containerPort: 50003
              protocol: TCP
            - containerPort: 50005
              protocol: TCP
            - containerPort: 50007
              protocol: TCP
          volumeMounts:
            - name: sender-scripts
              mountPath: /opt/pointcloud/sender_scripts
              readOnly: true
      volumes:
        - name: sender-scripts
          configMap:
            name: l4s-lidar-sender-scripts
