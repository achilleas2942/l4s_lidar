apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: l4s-lidar-sender-role
  namespace: l4s-lidar
  labels:
    app.kubernetes.io/name: l4s-lidar-sender
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: l4s-lidar-sender-rolebinding
  namespace: l4s-lidar
  labels:
    app.kubernetes.io/name: l4s-lidar-sender
subjects:
  - kind: ServiceAccount
    name: l4s-lidar-sender
roleRef:
  kind: Role
  name: l4s-lidar-sender-role
  apiGroup: rbac.authorization.k8s.io
  